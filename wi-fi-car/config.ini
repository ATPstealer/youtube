# Настройки Wi-Fi Car. Читаются при запуске app.py — после правки перезапустить.
# Другой файл: python3 app.py --config /path/to/other.ini
# Trim здесь нет: его ставит ползунок в UI и сохраняет в settings.json (см. [drive] settings_file).

[server]
host = 0.0.0.0               # 0.0.0.0 — доступ со всей сети, 127.0.0.1 — только с самой Pi
port = 5000                  # можно переопределить: python3 app.py --port 8080
log_lines = 50               # сколько последних строк показывает панель System Logs
status_log_interval = 5      # с, как часто писать в лог FULL STATUS (0 — не писать)

[ui]
default_speed = 30           # %, скорость на ползунке при открытии страницы
speed_step = 10              # %, шаг клавиш [ и ]
trim_step = 0.5              # %, шаг ползунка Trim
status_poll_ms = 500         # мс, как часто обновляется строка статуса под ползунками
log_poll_ms = 2000           # мс, как часто обновляется панель логов (когда открыта)

[drive]
sync = true                  # синхронизация колёс по энкодерам; false — ехать только по калибровке
loop_hz = 20                 # Гц, как часто контроллер правит ШИМ
kp = 0.3                     # ШИМ на 1 тик разницы пути. Виляет — уменьшить; медленно выравнивается — увеличить
ki = 0.3                     # ШИМ на тик·с. Добирает остаточную разницу; слишком большой — раскачка
max_correction = 20          # макс. поправка ШИМ на одно колесо
min_pwm = 18                 # мин. ШИМ на ходу: ниже колесо под нагрузкой встаёт (в воздухе мёртвая зона до 14)
max_trim = 15                # %, пределы ползунка Trim
stall_time = 0.5             # с без тиков на одном колесе, пока другое крутится -> fault, синхронизация выкл.
stall_grace = 1.0            # с после старта, пока stall не проверяется
diverge_time = 1.0           # с на макс. поправке, за которые ошибка выросла ещё на diverge_ticks -> fault
diverge_ticks = 50
settings_file = settings.json  # куда UI сохраняет trim (путь относительно папки программы)

[motors]
# Пины BCM. Названия как на драйвере: ENA/IN1/IN2 — канал A, ENB/IN3/IN4 — канал B.
left_ena = 13
left_in1 = 19
left_in2 = 26
right_enb = 12
right_in3 = 20
right_in4 = 21
left_reverse = false         # true — мотор крутится не в ту сторону (меняет IN местами программно)
right_reverse = true
pwm_frequency = 1000         # Гц, частота программного ШИМ
# Энкодеры: A — счёт тиков, B — направление
left_enc_a = 14
left_enc_b = 15
right_enc_a = 17
right_enc_b = 27

[camera]
width = 640
height = 360
fps = 30
jpeg_quality = 95            # 1–100: меньше — меньше трафик и задержка, хуже картинка
